<title>Chemin d'Etoudi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Big+Shoulders+Display:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0d1310;--panel:#131c17;--panel2:#1a261f;--panel3:#223129;--ink:#eef3ec;--muted:#9fb2a5;--line:rgba(238,243,236,.13);
  --g:#22a563;--r:#e5473f;--y:#f6c945;--accent:#f6c945;--accent-ink:#1b1504;--ok:#43c47c;--warn:#f0a93a;--bad:#ef5350;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.app{height:100%;display:grid;grid-template-rows:minmax(210px,40%) minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.app{grid-template-columns:minmax(0,1fr) 460px;grid-template-rows:100%}}
.view{position:relative;overflow:hidden;background:linear-gradient(#6f97b8,#c9d6d0);min-height:0}
.view canvas{position:absolute;inset:0;z-index:0}
.hud,.place,.subs,.nogl{z-index:2}
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;color:#12211a;font-weight:700}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{background:rgba(10,16,13,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.8rem;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:500}
button.chip{cursor:pointer;color:var(--ink)}
.badge{background:var(--r);color:#fff;border-radius:999px;padding:0 6px;font-size:.7rem;font-family:var(--mono)}
.hud .tools{display:grid;grid-template-columns:repeat(2,36px);gap:6px;flex:none}
.icon{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(10,16,13,.72);border:1px solid var(--line);padding:0}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon[aria-pressed="false"]{opacity:.55}
.place{position:absolute;left:12px;bottom:10px;right:12px;display:flex;flex-direction:column;gap:2px;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.place .k{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#f6e7a8;font-weight:800}
.place .n{font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1;letter-spacing:.01em}
.subs{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(8,12,10,.86);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;max-height:60%;overflow:auto}
.subs .who{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--y);font-weight:800;display:flex;justify-content:space-between;gap:8px}
.subs .txt{font-size:.95rem}
.side{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:var(--panel);border-top:1px solid var(--line)}
@media (min-width:900px){.side{border-top:0;border-left:1px solid var(--line)}}
.flagbar{height:4px;background:linear-gradient(90deg,#007a5e 0 33.3%,#ce1126 33.3% 66.6%,#fcd116 66.6%)}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.g .lab{display:flex;justify-content:space-between;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.g .lab b{font-family:var(--mono);font-weight:500;color:var(--ink);letter-spacing:0}
.bar{height:6px;border-radius:3px;background:var(--panel3);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .5s}
.bar i.mid{background:var(--warn)}.bar i.low{background:var(--bad)}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;font-weight:800;font-size:.85rem;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--y)}
.panel{flex:1;overflow-y:auto;overflow-x:hidden;min-width:0;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800}
.title{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:.95;letter-spacing:.01em}
.h2{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.05}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.news{border-left:3px solid var(--r)}
.stamp{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:var(--panel3);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.choice:hover{border-color:var(--y)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice .t{font-weight:700}
.hints{display:flex;flex-wrap:wrap;gap:4px}
.hint{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.hint.big{color:var(--ink);border-color:var(--ink);font-weight:800}
.hint.up{color:var(--ok);border-color:var(--ok)}.hint.down{color:var(--bad);border-color:var(--bad)}
.hint.loi{color:var(--y);border-color:var(--y)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel3);border-radius:10px;padding:10px 14px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.opt b{font-family:var(--display);font-size:1.25rem;font-weight:800;letter-spacing:.01em}
.opt span{font-size:.82rem;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--y);box-shadow:0 0 0 1px var(--y) inset}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
input[type=text],input[type=number],select{background:var(--panel3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);width:100%}
input[type=color]{width:48px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel3);padding:3px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.9rem}
.kv span:nth-child(odd){color:var(--muted)}
.kv b{font-family:var(--mono);font-weight:500;text-align:right;overflow-wrap:anywhere}
.map{width:100%;max-width:420px;align-self:center}
.map path{stroke:#0d1310;stroke-width:1.4;cursor:pointer;transition:opacity .2s}
.map path:hover{opacity:.85}
.map path.sel{stroke:var(--y);stroke-width:3}
.map text{font-size:11px;font-weight:800;fill:#fff;paint-order:stroke;stroke:#0d1310;stroke-width:3px;pointer-events:none;font-family:var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.seats{display:flex;height:20px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.seats i{display:block;height:100%}
.bars{display:flex;flex-direction:column;gap:6px}
.bars .b{display:grid;grid-template-columns:92px 1fr 54px;gap:8px;align-items:center;font-size:.85rem}
.bars .b .t{height:14px;border-radius:4px;background:var(--panel3);overflow:hidden}
.bars .b .t i{display:block;height:100%;transition:width 1.2s ease}
.bars .b b{font-family:var(--mono);font-weight:500;text-align:right}
.log{display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.log div{border-left:2px solid var(--line);padding-left:10px}
.log small{color:var(--muted);font-family:var(--mono);font-size:.72rem}
.pill{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.law{border-left:2px solid var(--y);padding-left:12px;display:flex;flex-direction:column;gap:4px}
.law .r{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--y);font-weight:800}
.law .j{font-size:.82rem;color:var(--muted)}
.cal{display:flex;flex-direction:column;gap:6px}
.cal div{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;border-bottom:1px dashed var(--line);padding-bottom:6px}
.ap{display:flex;gap:6px;align-items:center;font-size:.85rem}
.ap i{width:12px;height:12px;border-radius:50%;background:var(--y);display:inline-block}
.ap i.off{background:var(--panel3);border:1px solid var(--line)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet .in{background:var(--panel);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;border:1px solid var(--line);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:900px){.sheet{align-items:center}.sheet .in{border-radius:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:var(--panel3);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:40;font-weight:700;max-width:90%}
.players{display:flex;flex-direction:column;gap:8px}
.player{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.big-num{font-family:var(--mono);font-size:2.2rem;font-weight:500;line-height:1}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fact{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.fact b{display:block;font-family:var(--mono);font-weight:500;font-size:1.15rem}
.fact span{font-size:.75rem;color:var(--muted)}
.delta{font-family:var(--mono);font-size:.75rem}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
@media (prefers-reduced-motion:reduce){.bar i,.bars .b .t i{transition:none}}

/* ---- rendu cinéma : étalonnage, vignette, mini-carte ---- */
.view canvas{filter:saturate(1.16) contrast(1.07)}
.view::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.42) 100%)}
.minimap{position:absolute;right:10px;bottom:10px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.minimap .mmap{width:92px;height:92px;border-radius:50%;overflow:hidden;background:rgba(10,14,20,.78);border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.5);display:grid;place-items:center}
.minimap .mmap svg{width:120%;height:120%}.minimap .mmap text{display:none}.minimap .mmap path{stroke:#0b0f14;stroke-width:1.5}.minimap .mmap path.sel{stroke:#fff;stroke-width:3}
.minimap .stars{font-size:15px;color:#fff;text-shadow:0 1px 3px #000;letter-spacing:1px;background:rgba(10,14,20,.6);border-radius:10px;padding:0 6px}
.vidbtn{border-color:#e11d48!important;color:#fff!important;background:rgba(225,29,72,.18)!important}
li .vidbtn,.log .vidbtn{padding:2px 8px!important;font-size:.72rem!important;margin-left:4px}
/* ---- lecteur vidéo ---- */
.film{position:fixed;inset:0;z-index:60;background:#000;color:#fff;overflow:hidden}
.film .fview{position:absolute;inset:0}.film .fview canvas{position:absolute;inset:0;filter:saturate(1.12) contrast(1.1)}
.film .lb{position:absolute;left:0;right:0;height:7vh;background:#000;z-index:2}.film .lb.top{top:0}.film .lb.bot{bottom:0}
.film .fhud{position:absolute;top:calc(7vh + 10px);left:14px;z-index:3;display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:.78rem}
.film .rec{color:#ef4444;animation:blink 1s steps(2) infinite;font-weight:700}.film .src{background:rgba(0,0,0,.55);padding:2px 8px;border-radius:4px}
.film .fclock{position:absolute;top:calc(7vh + 40px);right:14px;z-index:3;font-family:var(--mono);font-size:.78rem;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:4px}
@keyframes blink{50%{opacity:.15}}
.film .lower{position:absolute;left:14px;right:14px;bottom:calc(7vh + 56px);z-index:3;display:flex;flex-direction:column;gap:3px;max-width:640px}
.film .lower .k{align-self:flex-start;background:#e11d48;color:#fff;font-weight:800;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px}
.film .lower b{font-family:var(--disp,inherit);font-size:1.25rem;line-height:1.15;background:rgba(0,0,0,.72);padding:6px 10px;text-transform:uppercase}
.film .lower .sub{font-size:.82rem;background:rgba(0,0,0,.6);padding:6px 10px;line-height:1.35;max-height:5.6em;overflow:auto}
.film .fbar{position:absolute;left:0;right:0;bottom:7vh;height:3px;background:rgba(255,255,255,.2);z-index:3}.film .fbar i{display:block;height:100%;width:0;background:#e11d48}
.film .fctl{position:absolute;right:14px;bottom:calc(7vh + 12px);z-index:3;display:flex;gap:8px}
.film .fnote{position:absolute;left:14px;bottom:calc(7vh + 18px);z-index:3;font-size:.68rem;opacity:.7}
@media (max-width:560px){.film .fnote{display:none}.film .lower b{font-size:1.02rem}}
@media (prefers-reduced-motion:reduce){.film .rec{animation:none}}

/* ---- HUD façon jeu d'action ---- */
.minimap{left:10px;right:auto!important;bottom:10px}
.place{left:auto!important;right:12px!important;align-items:flex-end;text-align:right}
.gtahud{position:absolute;right:10px;top:140px;z-index:2;display:flex;flex-direction:column;align-items:flex-end;gap:3px;pointer-events:none;font-family:Anton,Impact,sans-serif}
.gtahud .clk{font-size:30px;line-height:1;color:#fff;letter-spacing:1px;-webkit-text-stroke:1.5px #000;text-shadow:2px 2px 0 #000}
.gtahud .bar{width:96px;height:8px;background:#3b0d0d;border:2px solid #000}.gtahud .bar i{display:block;height:100%;background:#d61f1f}
.gtahud .cash{font-size:22px;line-height:1;color:#3fa34d;-webkit-text-stroke:1.2px #000;text-shadow:2px 2px 0 #000;letter-spacing:1px}
.joy{position:absolute;right:16px;bottom:18px;width:118px;height:118px;border-radius:50%;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.5);z-index:3;touch-action:none}
.joy .knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.view.street .place{display:none}
.minimap .mmap canvas{width:100%;height:100%}

.app.full{grid-template-rows:100%!important;grid-template-columns:minmax(0,1fr)!important}.app.full .side{display:none}
@media (max-width:560px){.gtahud{top:132px}.gtahud .clk{font-size:24px}.gtahud .cash{font-size:17px}.gtahud .bar{width:78px}.joy{width:100px;height:100px}}
.gfxload{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(5,8,12,.82);color:#fff;text-align:center;padding:20px}
.vxpanel{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(560px,calc(100vw - 24px));z-index:60;background:var(--card,#16181d);color:inherit;border:1px solid var(--line,#333);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
body.travel .sheet{z-index:65}
body.travel .vxpanel{z-index:70}
textarea[data-grow]{resize:none;overflow-y:auto;min-height:46px;max-height:220px;line-height:1.35;width:100%;background:var(--panel3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.sheet .in{position:relative}
.sheet-x{position:sticky;top:0;align-self:flex-end;margin:-8px -6px -30px 0;z-index:5;width:36px;height:36px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--panel3);color:var(--ink);font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer}
.sheet-x:hover{background:#c42b1c;border-color:#c42b1c;color:#fff}
.sheet .in>.eyebrow:first-of-type,.sheet .in>.h2:first-of-type{padding-right:44px}
.micon{background:#c42b1c !important;border-color:#c42b1c !important;color:#fff !important;animation:micp 1.6s ease-in-out infinite}
@keyframes micp{50%{box-shadow:0 0 0 6px rgba(196,43,28,.25)}}
@media (prefers-reduced-motion:reduce){.micon{animation:none}}
.instr{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.vxlog{max-height:34vh;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:14px}
.vxlog .me{align-self:flex-end;background:rgba(80,140,255,.18);padding:6px 10px;border-radius:10px;max-width:85%}
.vxlog .it{align-self:flex-start;background:rgba(255,255,255,.07);padding:6px 10px;border-radius:10px;max-width:85%}
</style>

<div class="app" id="app">
  <div class="view" id="view">
    <div class="nogl" id="nogl" hidden>Votre appareil n'affiche pas la 3D. Le jeu reste jouable.</div>
    <div class="hud">
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0"><div class="row" style="gap:6px;align-items:flex-start"><span class="chip" id="hudDate">Cameroun · <b>octobre 2026</b></span><button class="chip" id="hudMood" hidden aria-label="Humeur de la population"></button></div><span class="chip" id="hudLoc" hidden aria-live="polite" title="Votre position" style="max-width:min(72vw,420px);overflow:hidden;text-overflow:ellipsis"></span></div>
      <div class="tools">
        <button class="icon" id="bGfx" aria-label="Paramètres" title="Paramètres (graphismes, son, avatar)"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.6L20 8l-4.3 4 1.2 6L12 15l-4.9 3 1.2-6L4 8l5.6-.4z"/></svg></button>
        <button class="icon" id="bWalk" aria-pressed="false" aria-label="Marcher dans la rue" title="Marcher dans la rue"><svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="m9 21 2-6 3 3v5M8 12l3-4 4 2 2 3M11 8l-1 5"/></svg></button>
